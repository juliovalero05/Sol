name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libncurses5-dev libffi-dev libssl-dev automake autoconf libtool pkg-config libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython
      - name: Build APK
        run: |
          yes | buildozer android debug || true
          $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: ./bin/*.apk
