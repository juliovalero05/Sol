name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer
          pip install --upgrade git+https://github.com/kivy/python-for-android.git
      - name: Build APK
        run: |
          # Primero descarga el SDK (va a fallar pero lo descarga)
          yes | buildozer android debug || true
          # Acepta todas las licencias
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.3" "platforms;android-33" || true
          # Ahora sí compila de verdad
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sol-APK
          path: bin/*.apk
