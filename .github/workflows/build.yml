name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev openjdk-17-jdk unzip
          pip install buildozer cython
      - name: Accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-33" "platform-tools"
      - name: Build APK
        run: |
          buildozer android debug --verbose
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sol-APK
          path: bin/*.apk
